[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ASE_RSIRFO"
version = "0.1.2"
description = "Restricted-Step Image Rational Function Optimisation (RS-I-RFO) as an ASE Optimizer subclass"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "ss0832" }
]
keywords = [
    "computational chemistry",
    "geometry optimisation",
    "transition state",
    "rational function optimisation",
    "ASE",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "ase>=3.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/ss0832/ASE_RSIRFO"
Repository = "https://github.com/ss0832/ASE_RSIRFO"
"Bug Tracker" = "https://github.com/ss0832/ASE_RSIRFO/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ase_rsirfo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
